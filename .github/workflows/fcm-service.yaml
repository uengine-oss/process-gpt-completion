name: fcm-service-build-and-deploy

# 왜 따로 있는가
#   fcm_service 는 completion 과 다른 이미지(ghcr.io/uengine-oss/fcm-service)로
#   돌지만, 이 저장소에는 그 이미지를 만드는 흐름이 없었다. 그래서 fcm_service 를
#   고쳐 커밋해도 클러스터의 파드는 옛 코드 그대로였다 — 알림이 왜 안 오는지
#   드러나지 않는 이유가 이것이었다.
#
# 언제 도는가
#   fcm_service/ 나 그 시험이 바뀔 때만 돈다. 알림과 무관한 커밋마다 이미지를
#   다시 만들 이유가 없다. 손으로도 돌릴 수 있게 workflow_dispatch 를 둔다.

on:
  push:
    branches: [main]
    paths:
      - 'fcm_service/**'
      - 'tests/test_fcm_recipients.py'
      - '.github/workflows/fcm-service.yaml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        run: |
          python -m pip install -U pip
          python -m pip install pytest

      - name: Run fcm recipient tests
        run: python -m pytest -vv --tb=long -ra tests/test_fcm_recipients.py

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_NAME=ghcr.io/uengine-oss/fcm-service:$IMAGE_TAG
          IMAGE_NAME_LATEST=ghcr.io/uengine-oss/fcm-service:latest

          cd fcm_service
          docker build -t $IMAGE_NAME -t $IMAGE_NAME_LATEST .
          docker push $IMAGE_NAME
          docker push $IMAGE_NAME_LATEST

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: uengine-oss/process-gpt-k8s
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # 태그를 커밋 해시로 박는다. :latest 로 두면 imagePullPolicy 가
      # IfNotPresent 라 노드에 이미 있는 옛 이미지를 계속 쓴다 — 배포해도
      # 아무것도 바뀌지 않는다.
      - name: Update image tag in GitOps repository
        run: |
          cd gitops-repo
          yq eval '(.spec.template.spec.containers[] | select(.name == "fcm-service")).image = "'$IMAGE_NAME'"' -i deployments/fcm-service-deployment.yaml
          echo "Updated image to: $IMAGE_NAME"

      - name: Commit and push changes
        run: |
          cd gitops-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update fcm-service image to $IMAGE_TAG" || exit 0
          git push

      - name: Summary
        run: |
          echo "## 🔔 FCM Service Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ ArgoCD will sync from process-gpt-k8s." >> $GITHUB_STEP_SUMMARY
